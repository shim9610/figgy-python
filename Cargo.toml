[package]
name = "figgyplot"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
renderer = { package = "figgy-renderer", version = "=0.16.1", features = ["serde"] }
wgpu = "30"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"

winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"

[profile.release]
lto = "thin"
codegen-units = 1
