[package]
name = "figgyplot"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
renderer = { package = "figgy-renderer", version = "=0.17.0", features = ["serde"] }
wgpu = "30"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"

winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"

[profile.release]
lto = "thin"
codegen-units = 1

# figgy-renderer 0.17.0 / figgy-model 0.11.0 are not on crates.io yet; until they
# are, build them from the pinned upstream revision. Remove this patch before a release
# (docs/PUBLISHING.md): a release builds against the published crates.
[patch.crates-io]
figgy-renderer = { git = "https://github.com/shim9610/figgy", rev = "165aa17c291b622da88dca5107369d5b6c7d6ddd" }
figgy-model = { git = "https://github.com/shim9610/figgy", rev = "165aa17c291b622da88dca5107369d5b6c7d6ddd" }
