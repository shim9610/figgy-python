[package]
name = "figgyplot"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
renderer = { package = "figgy-renderer", version = "=0.17.0", features = ["serde"] }
wgpu = "30"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"

winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep native renderer/model sources at the same immutable revision as packaged
# WASM, including release builds. The asset gate verifies this pairing. Moving
# to registry sources requires a coordinated provenance/guard migration; see
# docs/PUBLISHING.md. Publishing the Rust crates alone does not remove this pin.
[patch.crates-io]
figgy-renderer = { git = "https://github.com/shim9610/figgy", rev = "bf665c099e25a39ff2f7229f9ad4f4197d223e45" }
figgy-model = { git = "https://github.com/shim9610/figgy", rev = "bf665c099e25a39ff2f7229f9ad4f4197d223e45" }
