[package]
name = "figgyplot"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
renderer = { package = "figgy-renderer", version = "=0.18.1", features = ["serde"] }
wgpu = "30"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"

winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
fontdb = "0.24"
arboard = "3.6.1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15.4"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

# Cargo.lock pins the crates.io renderer/model versions and checksums. The asset
# gate pairs them with the published source revision used to build bundled WASM;
# see python/figgyplot/assets/provenance.json and docs/PUBLISHING.md.
