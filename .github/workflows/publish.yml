name: Publish figgyplot (manual only)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build TestPyPI, verify an already uploaded release, or promote verified files to PyPI'
        type: choice
        options: [testpypi, verify-testpypi, pypi]
        default: testpypi
        required: true
      version:
        description: 'Exact source version (public upload to the selected index)'
        required: true
        type: string
        default: '0.4.0'
      testpypi-run-id:
        description: 'For verify-testpypi/PyPI: numeric TestPyPI run ID from the run URL (not #2)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-figgyplot
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require main and the exact source version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          TEST_RUN_ID: ${{ inputs.testpypi-run-id }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Publication is allowed only from main; select main in Run workflow.')
          if os.environ['RELEASE_TARGET'] not in ('testpypi', 'verify-testpypi', 'pypi'):
              raise SystemExit('Target must be testpypi, verify-testpypi or pypi.')
          if os.environ['RELEASE_TARGET'] != 'testpypi' and not (os.environ['TEST_RUN_ID'].isascii() and os.environ['TEST_RUN_ID'].isdecimal() and int(os.environ['TEST_RUN_ID']) > 0):
              raise SystemExit('Enter testpypi-run-id: the numeric ID after /actions/runs/ in the TestPyPI run URL.')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          cargo = tomllib.loads(Path('Cargo.toml').read_text())['package']
          # Cargo.toml is the single version source: pyproject declares the
          # version dynamic and figgyplot.__version__ comes from the extension.
          version = cargo['version']
          if project['name'] != 'figgyplot' or 'version' in project or 'version' not in project.get('dynamic', []) or os.environ['REQUESTED_VERSION'] != version:
              raise SystemExit('Input must match the Cargo.toml version, and pyproject.toml must declare the version dynamic.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  build:
    needs: gate
    if: inputs.target == 'testpypi'
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  validate:
    needs: [gate, build]
    if: inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-sdist
          path: artifacts/figgyplot-sdist
      - run: python -m pip install 'packaging>=24' 'PyYAML>=6,<7' twine
      - name: Validate every wheel, sdist, version and packaged asset
        run: |
          python scripts/prepare_release.py artifacts dist release-manifest/manifest.json
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest/manifest.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: ${{ inputs.target == 'pypi' && 'Verify tested distributions for PyPI' || 'Verify existing TestPyPI files' }}
    needs: gate
    if: inputs.target == 'pypi' || inputs.target == 'verify-testpypi'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release-only repairs may reuse the original package commit.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read the successful TestPyPI run and all installation jobs
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RUN_ID: ${{ inputs.testpypi-run-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID" > tested-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID/jobs?per_page=100" > tested-jobs.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-files
          path: dist
          run-id: ${{ inputs.testpypi-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest
          run-id: ${{ inputs.testpypi-run-id }}
          github-token: ${{ github.token }}
      - run: python -m pip install 'packaging>=24' 'PyYAML>=6,<7' twine
      - name: Verify provenance, complete coverage and every byte before promotion
        env:
          TEST_RUN_ID: ${{ inputs.testpypi-run-id }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python scripts/check_promotion.py tested-run.json tested-jobs.json dist release-manifest/manifest.json "$TEST_RUN_ID" "$RELEASE_TARGET"
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest/manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to ${{ inputs.target == 'pypi' && 'PyPI' || 'TestPyPI' }}
    needs: [gate, validate, promote]
    # One preparation branch is intentionally skipped; the selected one must pass.
    if: >-
      always() && !cancelled() && needs.gate.result == 'success' &&
      ((inputs.target == 'testpypi' && needs.validate.result == 'success') ||
       (inputs.target == 'pypi' && needs.promote.result == 'success'))
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.target }}
      url: https://${{ inputs.target == 'pypi' && 'pypi.org' || 'test.pypi.org' }}/project/figgyplot/
    # OIDC exists only here; build/test jobs receive no publishing permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-files
          path: dist
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://${{ inputs.target == 'pypi' && 'upload.pypi.org' || 'test.pypi.org' }}/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: false

  install:
    name: ${{ inputs.target == 'pypi' && 'PyPI' || 'TestPyPI' }} install / ${{ matrix.runner }} / Python ${{ matrix.python }}
    needs: [gate, publish, promote]
    # success() also considers skipped ancestors of publish. Override it and
    # require the selected preparation/upload to succeed explicitly.
    if: >-
      always() && !cancelled() && needs.gate.result == 'success' &&
      ((inputs.target == 'verify-testpypi' && needs.promote.result == 'success') ||
       (inputs.target != 'verify-testpypi' && needs.publish.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, python: '3.12'}
          - {runner: ubuntu-24.04-arm, python: '3.12'}
          - {runner: windows-latest, python: '3.12'}
          - {runner: windows-11-arm, python: '3.12'}
          - {runner: macos-15-intel, python: '3.12'}
          - {runner: macos-15, python: '3.12'}
          - {runner: ubuntu-24.04, python: '3.8'}
          - {runner: ubuntu-24.04, python: '3.15t'}
          - {runner: windows-11-arm, python: '3.15t'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest
      - name: Download from the selected index, compare bytes and install
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.python }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_TARGET: ${{ inputs.target == 'pypi' && 'pypi' || 'testpypi' }}
        run: |
          uv python install "$TEST_PYTHON"
          uv venv .testpypi --python "$TEST_PYTHON"
          if [ -f .testpypi/Scripts/python.exe ]; then
            test_python=.testpypi/Scripts/python.exe
          else
            test_python=.testpypi/bin/python
          fi
          # Resolve dependencies from PyPI; figgyplot is downloaded ONLY from TestPyPI.
          uv pip install --python "$test_python" pip 'packaging>=24' 'numpy>=1.24' 'anywidget>=0.9,<1'
          "$test_python" scripts/check_testpypi.py release-manifest/manifest.json "$RELEASE_VERSION" "$RELEASE_TARGET"
          "$test_python" scripts/check_installed.py
