name: Publish figgyplot to TestPyPI (manual only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version in pyproject.toml and Cargo.toml (public TestPyPI upload)'
        required: true
        type: string
        default: '0.2.0'

permissions:
  contents: read

concurrency:
  group: publish-figgyplot-testpypi
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require main and the exact source version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Publication is allowed only from main; select main in Run workflow.')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          cargo = tomllib.loads(Path('Cargo.toml').read_text())['package']
          version = project['version']
          if project['name'] != 'figgyplot' or cargo['version'] != version or os.environ['REQUESTED_VERSION'] != version:
              raise SystemExit('Input version, pyproject.toml and Cargo.toml must match exactly.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  build:
    needs: gate
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  validate:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-sdist
          path: artifacts/figgyplot-sdist
      - run: python -m pip install 'packaging>=24' 'PyYAML>=6,<7' twine
      - name: Validate every wheel, sdist, version and packaged asset
        run: |
          python scripts/prepare_release.py artifacts dist release-manifest/manifest.json
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest/manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to TestPyPI
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/figgyplot/
    # OIDC exists only here; build/test jobs receive no publishing permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-files
          path: dist
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: false

  install:
    name: TestPyPI install / ${{ matrix.runner }} / Python ${{ matrix.python }}
    needs: [gate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, python: '3.12'}
          - {runner: ubuntu-24.04-arm, python: '3.12'}
          - {runner: windows-latest, python: '3.12'}
          - {runner: windows-11-arm, python: '3.12'}
          - {runner: macos-15-intel, python: '3.12'}
          - {runner: macos-15, python: '3.12'}
          - {runner: ubuntu-24.04, python: '3.8'}
          - {runner: ubuntu-24.04, python: '3.15t'}
          - {runner: windows-11-arm, python: '3.15t'}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: figgyplot-release-manifest
          path: release-manifest
      - name: Download from TestPyPI, compare published bytes and install
        shell: bash
        env:
          TEST_PYTHON: ${{ matrix.python }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          uv python install "$TEST_PYTHON"
          uv venv .testpypi --python "$TEST_PYTHON"
          if [ -f .testpypi/Scripts/python.exe ]; then
            test_python=.testpypi/Scripts/python.exe
          else
            test_python=.testpypi/bin/python
          fi
          # Resolve dependencies from PyPI; figgyplot is downloaded ONLY from TestPyPI.
          uv pip install --python "$test_python" pip 'packaging>=24' 'numpy>=1.24' 'anywidget>=0.9,<1'
          "$test_python" scripts/check_testpypi.py release-manifest/manifest.json "$RELEASE_VERSION"
          "$test_python" scripts/check_installed.py
