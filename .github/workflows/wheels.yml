name: Build figgyplot wheels (manual only)

on:
  # Intentionally no push, pull_request, release, tag or schedule triggers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # same commit as the build action
          path: .ci/maturin-action
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate workflow and actual maturin-action inputs before building
        env:
          FIGGYPLOT_MATURIN_ACTION: .ci/maturin-action/action.yml
        run: bash scripts/ci-preflight.sh

  wheels:
    needs: workflow-check
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-arm64, linux-musl-x86_64, linux-musl-arm64, windows-x86_64, windows-arm64, macos-x86_64, macos-arm64]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', '3.14t', '3.15t']
        exclude:
          # Current musllinux images no longer ship Python 3.8.
          - {platform: linux-musl-x86_64, python: '3.8'}
          - {platform: linux-musl-arm64, python: '3.8'}
          # NumPy's published Windows ARM64 wheels start at Python 3.12.
          - {platform: windows-arm64, python: '3.8'}
          - {platform: windows-arm64, python: '3.9'}
          - {platform: windows-arm64, python: '3.10'}
          - {platform: windows-arm64, python: '3.11'}
        include:
          - {platform: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, linux: true, compatibility: manylinux_2_28, container: '2_28', image: 'quay.io/pypa/manylinux_2_28_x86_64:latest'}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, linux: true, compatibility: manylinux_2_28, container: '2_28', image: 'quay.io/pypa/manylinux_2_28_aarch64:latest'}
          - {platform: linux-musl-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, linux: true, compatibility: musllinux_1_2, container: musllinux_1_2, image: 'quay.io/pypa/musllinux_1_2_x86_64:latest', rustflags: '-C target-feature=-crt-static'}
          - {platform: linux-musl-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, linux: true, compatibility: musllinux_1_2, container: musllinux_1_2, image: 'quay.io/pypa/musllinux_1_2_aarch64:latest', rustflags: '-C target-feature=-crt-static'}
          - {platform: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, linux: false}
          - {platform: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, linux: false}
          - {platform: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, linux: false, deployment: '10.15'}
          - {platform: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, linux: false, deployment: '11.0'}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
      FIGGYPLOT_PYTHON: ${{ matrix.python }}
      FIGGYPLOT_COMPATIBILITY: ${{ matrix.compatibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - name: Build portable Linux wheel
        if: matrix.linux
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.container }}
          container: ${{ matrix.image }}
          rust-toolchain: '1.99.0'
          docker-options: -e FIGGYPLOT_PYTHON -e FIGGYPLOT_COMPATIBILITY -e RUSTFLAGS
          before-script-linux: bash scripts/ci-before-linux.sh
          # maturin-action adds --manylinux from its manylinux input. Passing
          # --compatibility as well creates two tags and maturin rejects them.
          args: --release --locked --out dist -i /usr/local/bin/python${{ matrix.python }}
      - name: Build native Windows/macOS wheel
        if: ${{ !matrix.linux }}
        shell: bash
        run: |
          uv python install "$FIGGYPLOT_PYTHON"
          uv venv .build-python --python "$FIGGYPLOT_PYTHON"
          if [ -f .build-python/Scripts/python.exe ]; then
            build_python=.build-python/Scripts/python.exe
          else
            build_python=.build-python/bin/python
          fi
          uv pip install --python "$build_python" 'maturin>=1.15,<2'
          "$build_python" -m maturin build --release --locked --target '${{ matrix.target }}' --out dist -i "$build_python"
      - name: Check Linux wheel in its matching libc container
        if: matrix.linux
        shell: bash
        run: |
          docker run --rm -e FIGGYPLOT_PYTHON -e FIGGYPLOT_COMPATIBILITY \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            '${{ matrix.image }}' bash scripts/ci-check-linux.sh
      - name: Check metadata and install only binary distributions
        if: ${{ !matrix.linux }}
        shell: bash
        run: |
          uv python install "$FIGGYPLOT_PYTHON"
          uv venv .wheel-test --python "$FIGGYPLOT_PYTHON"
          if [ -f .wheel-test/Scripts/python.exe ]; then
            test_python=.wheel-test/Scripts/python.exe
          else
            test_python=.wheel-test/bin/python
          fi
          uv pip install --python "$test_python" twine
          "$test_python" -m twine check --strict dist/*.whl
          for wheel in dist/*.whl; do
            uv pip install --python "$test_python" --only-binary=:all: "${wheel}[notebook]"
          done
          "$test_python" scripts/check_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: workflow-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
      - run: python -m pip install maturin twine
      - run: maturin sdist --out dist && python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figgyplot-sdist
          path: dist/*.tar.gz

  linux-functional:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-x86_64-py3.12
          path: dist
      - name: Install software Vulkan and wheel test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git mesa-vulkan-drivers libvulkan1 libxkbcommon0 libxkbcommon-x11-0 xvfb xdotool xclip openbox wmctrl
          python -m venv .venv
          for wheel in dist/*.whl; do .venv/bin/python -m pip install "${wheel}[test]"; done
      - name: Test the installed portable wheel
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          cargo fmt --check
          .venv/bin/python scripts/check_x11_runtime.py
          xvfb-run -a -s '-screen 0 1600x1000x24' bash <<'SCRIPT'
            set -euo pipefail
            openbox > /tmp/figgyplot-openbox.log 2>&1 &
            wm_pid=$!
            trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
            .venv/bin/python -m pytest -q
          SCRIPT
