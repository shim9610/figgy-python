name: PR tests

on:
  workflow_dispatch:
  # The manual run passed; required PR checks have no path filters.
  pull_request:
    branches: [main]
  # merge_group:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: PR / Workflow and assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require native and Jupyter interaction changes together
        if: github.event_name == 'pull_request'
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha }}
          PARITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_interaction_parity.py --base "$PARITY_BASE" --head "$PARITY_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
          path: .ci/maturin-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bash scripts/ci-preflight.sh

  integration:
    name: PR / Linux integration
    needs: preflight
    runs-on: ubuntu-24.04
    # Baseline setup/build, priority checks and the full UI suite exceed 30m.
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      WGPU_BACKEND: vulkan
      FIGGY_TEST_JUPYTER: '1'
      FIGGY_TEST_HEADFUL: '1'
      FIGGY_TEST_TIMING: '1'
      FIGGY_REQUIRE_INTERACTION_PARITY: '1'
      FIGGYPLOT_MATURIN_ACTION: .ci/maturin-action/action.yml
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
          path: .ci/maturin-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Install native software-GPU and X11 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y git mesa-vulkan-drivers libvulkan1 libxkbcommon0 libxkbcommon-x11-0 xvfb xdotool xclip openbox wmctrl
      - name: Build and install the exact PR wheel
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python 'maturin>=1.15,<2'
          .venv/bin/python -m maturin build --release --locked --compatibility linux --out dist -i .venv/bin/python
          for wheel in dist/*.whl; do
            uv pip install --python .venv/bin/python --only-binary=:all: "${wheel}[test]"
          done
          uv pip install --python .venv/bin/python --only-binary=:all: 'PyYAML>=6,<7' 'playwright>=1.50,<2' 'jupyterlab>=4,<5' 'nbformat>=5,<6' 'ipykernel>=6'
          .venv/bin/python scripts/check_installed.py
          .venv/bin/python scripts/check_x11_runtime.py
      - name: Install Chromium and select software GPU drivers
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/ci_gpu_env.py
      - name: Test previous failures first, then native and Jupyter integration
        run: |
          cargo fmt --check
          mkdir -p ci-results
          xvfb-run -a -s '-screen 0 1600x1000x24' bash <<'SCRIPT'
            set -euo pipefail
            openbox > /tmp/figgyplot-openbox.log 2>&1 &
            wm_pid=$!
            trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
            # Measure the last failed radial screenshot before the full suite.
            # Await current surface completion before the unchanged capture deadline.
            .venv/bin/python -m pytest -vv --capture=tee-sys --durations=20 \
              --basetemp=ci-results/priority --junitxml=ci-results/priority.xml \
              tests/test_packaged_assets.py \
              'tests/test_interaction_parity.py::test_annotation_drawing_editing_and_cancel_in_both_hosts[radial]' \
              2>&1 | tee ci-results/priority.log
            .venv/bin/python -m pytest -vv --capture=tee-sys --durations=30 \
              --basetemp=ci-results/full --junitxml=ci-results/junit.xml \
              2>&1 | tee ci-results/full.log
          SCRIPT
      - name: Save integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-linux-integration-results
          path: ci-results
          retention-days: 5
          if-no-files-found: ignore

