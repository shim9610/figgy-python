name: PR tests

on:
  workflow_dispatch:
  # The manual run passed; required PR checks have no path filters.
  pull_request:
    branches: [main]
  # merge_group:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows_review_storage:
    name: PR / Windows review storage
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Exercise real Windows byte locks and atomic replacement
        run: uv run --no-project --python 3.12 --with pytest --with numpy python -m pytest -q tests/test_review_store.py

  preflight:
    name: PR / Workflow and assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require native and Jupyter interaction changes together
        if: github.event_name == 'pull_request'
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha }}
          PARITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_interaction_parity.py --base "$PARITY_BASE" --head "$PARITY_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
          path: .ci/maturin-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bash scripts/ci-preflight.sh

  build:
    name: PR / Linux wheel
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '4'
      WGPU_BACKEND: vulkan
      FIGGY_TEST_JUPYTER: '1'
      FIGGY_TEST_HEADFUL: '1'
      FIGGY_TEST_TIMING: '1'
      FIGGY_LAYOUT_PROBE: '1'
      FIGGY_REQUIRE_INTERACTION_PARITY: '1'
      FIGGYPLOT_MATURIN_ACTION: .ci/maturin-action/action.yml
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
          path: .ci/maturin-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Install native software-GPU and X11 runtime
        run: bash scripts/install_ci_runtime.sh
      - name: Build and install the exact PR wheel
        run: |
          cargo fmt --check
          uv python install 3.12
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python 'maturin>=1.15,<2'
          .venv/bin/python -m maturin build --release --locked --compatibility linux --out dist -i .venv/bin/python
          for wheel in dist/*.whl; do
            uv pip install --python .venv/bin/python --only-binary=:all: "${wheel}[test]"
          done
          uv pip install --python .venv/bin/python --only-binary=:all: 'PyYAML>=6,<7' 'playwright>=1.50,<2' 'jupyterlab>=4,<5' 'nbformat>=5,<6' 'ipykernel>=6'
          .venv/bin/python scripts/check_installed.py
          .venv/bin/python scripts/check_x11_runtime.py
          .venv/bin/python scripts/editor_control_inventory.py --check
          (cd dist && sha256sum ./*.whl > SHA256SUMS)
      - name: Save the verified PR wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-linux-wheel
          path: dist/
          retention-days: 5
          if-no-files-found: error

  integration_shards:
    name: PR / Linux integration shard ${{ matrix.shard }}
    needs: build
    # Fail closed on upstream failure, but let superseded runs be cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Disjoint execution preserves every assertion and the per-job time budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      WGPU_BACKEND: vulkan
      FIGGY_TEST_JUPYTER: '1'
      FIGGY_TEST_HEADFUL: '1'
      FIGGY_TEST_TIMING: '1'
      FIGGY_LAYOUT_PROBE: '1'
      FIGGY_REQUIRE_INTERACTION_PARITY: '1'
      FIGGYPLOT_MATURIN_ACTION: .ci/maturin-action/action.yml
      PYTHONUNBUFFERED: '1'
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Require the verified wheel
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PyO3/maturin-action
          ref: e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
          path: .ci/maturin-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install native software-GPU and X11 runtime
        run: bash scripts/install_ci_runtime.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-linux-wheel
          path: dist
      - name: Verify and install the built wheel
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          uv python install 3.12
          uv venv .venv --python 3.12
          for wheel in dist/*.whl; do
            uv pip install --python .venv/bin/python --only-binary=:all: "${wheel}[test]"
          done
          uv pip install --python .venv/bin/python --only-binary=:all: 'PyYAML>=6,<7' 'playwright>=1.50,<2' 'jupyterlab>=4,<5' 'nbformat>=5,<6' 'ipykernel>=6'
          .venv/bin/python scripts/check_installed.py
          .venv/bin/python scripts/check_x11_runtime.py
      - name: Install Chromium and select software GPU drivers
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/ci_gpu_env.py
      - name: Execute disjoint native and Jupyter test shard
        run: |
          mkdir -p ci-results
          xvfb-run -a -s '-screen 0 1600x1000x24' bash <<'SCRIPT'
            set -euo pipefail
            openbox > /tmp/figgyplot-openbox.log 2>&1 &
            wm_pid=$!
            trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
            # Collect the entire suite; execute each node ID on one runner.
            # The required integration job audits exact JUnit execution IDs.
            .venv/bin/python scripts/run_ci_tests.py -x -vv --capture=tee-sys --durations=30 \
              --ci-shard-count=4 --ci-shard-index="$CI_SHARD" \
              --basetemp=ci-results/full --junitxml=ci-results/junit.xml \
              2>&1 | tee ci-results/full.log
            echo 'CI pytest log pipeline exited'
          SCRIPT
      - name: Save integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-linux-integration-shard-${{ matrix.shard }}
          path: ci-results
          retention-days: 5
          if-no-files-found: ignore


  integration:
    name: PR / Linux integration
    needs: integration_shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.integration_shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-linux-integration-shard-*
          path: ci-results
      - name: Verify complete passing execution without duplicates or skips
        run: |
          for shard in 0 1 2 3; do
            mv "ci-results/pr-linux-integration-shard-$shard" "ci-results/shard-$shard"
          done
          python3 scripts/check_ci_execution.py ci-results --shards=4
      - name: Save execution audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-linux-integration-audit
          path: ci-results/execution-audit.json
          retention-days: 5
          if-no-files-found: error
